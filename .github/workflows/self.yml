name: LaorORG

on:
  workflow_dispatch:

jobs:
  secure-LaorORG:
    runs-on: self-hosted

    timeout-minutes: 3600

    steps:
      # ------------------------------------------------------------
      # 1. Configure Windows Remote Desktop
      # ------------------------------------------------------------
      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "=== Configuring Windows RDP ==="

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # KEEP Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Use standard RDP security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          # Make sure TermService starts automatically
          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          # Start RDP service
          Start-Service -Name 'TermService'

          # Enable Windows Firewall RDP rules
          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          Write-Host "RDP configuration completed."

      # ------------------------------------------------------------
      # 2. Configure existing runneradmin account
      # ------------------------------------------------------------
      - name: Configure runneradmin
        shell: powershell
        run: |
          Write-Host "=== Configuring runneradmin ==="

          $username = "runneradmin"
          $password = "Laor@001"

          # Verify existing account
          $user = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Error "The Windows user '$username' does not exist."
              Write-Error "Create runneradmin on the Windows machine first."
              exit 1
          }

          # Set password
          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          Set-LocalUser `
            -Name $username `
            -Password $securePassword

          # Make sure account is enabled
          Enable-LocalUser -Name $username

          # Password does not expire
          Set-LocalUser `
            -Name $username `
            -PasswordNeverExpires $true

          # Add to Remote Desktop Users
          $rdpGroup = Get-LocalGroup `
            -Name "Remote Desktop Users" `
            -ErrorAction SilentlyContinue

          if ($rdpGroup) {
              $member = Get-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -ErrorAction SilentlyContinue |
                Where-Object {
                    $_.Name -match "\\$username$"
                }

              if (-not $member) {
                  Add-LocalGroupMember `
                    -Group "Remote Desktop Users" `
                    -Member $username
              }
          }

          # Verify account
          Get-LocalUser -Name $username |
            Select-Object Name, Enabled, PasswordExpires

          Write-Host "runneradmin configured."

      # ------------------------------------------------------------
      # 3. Install / update Tailscale
      # ------------------------------------------------------------
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "=== Installing Tailscale ==="

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {

              $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
              $installer = "$env:TEMP\tailscale.msi"

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $installer

              Start-Process `
                -FilePath "msiexec.exe" `
                -ArgumentList "/i `"$installer`" /quiet /norestart" `
                -Wait

              Remove-Item $installer -Force
          }

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed."

      # ------------------------------------------------------------
      # 4. Enable Tailscale unattended mode
      # ------------------------------------------------------------
      - name: Configure Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== Configuring Tailscale ==="

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # Authenticate / configure the machine
          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="LaorORG" `
            --unattended=true

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale configuration failed."
              exit 1
          }

          Write-Host "Tailscale unattended mode enabled."

      # ------------------------------------------------------------
      # 5. Get Tailscale IP
      # ------------------------------------------------------------
      - name: Get Tailscale IP
        shell: powershell
        run: |
          Write-Host "=== Getting Tailscale IP ==="

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $tsIP = $null

          for ($i = 1; $i -le 30; $i++) {

              $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting for Tailscale... attempt $i/30"
              Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IPv4 address was not assigned."
              exit 1
          }

          Write-Host "Tailscale IPv4: $tsIP"

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # 6. Verify RDP
      # ------------------------------------------------------------
      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "=== Testing RDP ==="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not reachable."
              exit 1
          }

          Write-Host "RDP port 3389 is reachable."

      # ------------------------------------------------------------
      # 7. Display connection information
      # ------------------------------------------------------------
      - name: Show LaorORG connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "           LaorORG RDP ACCESS"
          Write-Host "=========================================="
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : runneradmin"
          Write-Host "Password     : Laor@001"
          Write-Host "RDP Port     : 3389"
          Write-Host "=========================================="
          Write-Host ""

      # ------------------------------------------------------------
      # 8. Keep workflow alive
      # ------------------------------------------------------------
      - name: Keep LaorORG runner active
        shell: powershell
        run: |
          Write-Host "LaorORG self-hosted runner is active."

          while ($true) {
              Write-Host "[$(Get-Date)] LaorORG online - Tailscale/RDP available"
              Start-Sleep -Seconds 300
          }
