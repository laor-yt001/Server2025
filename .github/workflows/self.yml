name: Secure Windows Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  secure-runner:
    runs-on: self-hosted

    steps:

      # ============================================================
      # 1. Configure Remote Desktop
      # ============================================================
      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " Configuring Remote Desktop"
          Write-Host "========================================"

          # Enable RDP
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Configure Remote Desktop service
          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          Start-Service -Name 'TermService'

          # Enable Windows Firewall rules for RDP
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Write-Host ""
          Write-Host "RDP configuration completed."

      # ============================================================
      # 2. Configure runneradmin account
      # ============================================================
      - name: Configure runneradmin
        shell: powershell
        env:
          RUNNERADMIN_PASSWORD: ${{ secrets.RUNNERADMIN_PASSWORD }}
        run: |
          Write-Host "========================================"
          Write-Host " Configuring runneradmin"
          Write-Host "========================================"

          $username = "runneradmin"

          if ([string]::IsNullOrWhiteSpace($env:RUNNERADMIN_PASSWORD)) {
              Write-Error "RUNNERADMIN_PASSWORD GitHub Secret is not configured."
              exit 1
          }

          # Check whether account exists
          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if (-not $existingUser) {
              Write-Host "Creating local user: $username"

              New-LocalUser `
                -Name $username `
                -PasswordNeverExpires `
                -Description "Remote Desktop account"

              Write-Host "User created."
          }
          else {
              Write-Host "User already exists."
          }

          # Build SecureString without ConvertTo-SecureString
          $securePassword = New-Object System.Security.SecureString

          foreach ($char in $env:RUNNERADMIN_PASSWORD.ToCharArray()) {
              $securePassword.AppendChar($char)
          }

          $securePassword.MakeReadOnly()

          # Set password
          Set-LocalUser `
            -Name $username `
            -Password $securePassword `
            -ErrorAction Stop

          # Enable account
          Enable-LocalUser -Name $username

          # Password never expires
          Set-LocalUser `
            -Name $username `
            -PasswordNeverExpires $true

          # Add to Remote Desktop Users
          $rdpGroup = "Remote Desktop Users"

          $alreadyMember = Get-LocalGroupMember `
            -Group $rdpGroup `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\$username$"
            }

          if (-not $alreadyMember) {
              Add-LocalGroupMember `
                -Group $rdpGroup `
                -Member $username

              Write-Host "Added $username to $rdpGroup."
          }
          else {
              Write-Host "$username is already in $rdpGroup."
          }

          Write-Host ""
          Write-Host "runneradmin configuration completed."

      # ============================================================
      # 3. Install Tailscale if missing
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " Checking Tailscale installation"
          Write-Host "========================================"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $tailscale) {
              Write-Host "Tailscale is already installed."
              Write-Host "Path: $tailscale"
          }
          else {
              Write-Host "Tailscale is not installed."
              Write-Host "Downloading installer..."

              $installer = "$env:TEMP\tailscale-setup.msi"

              Invoke-WebRequest `
                -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
                -OutFile $installer `
                -UseBasicParsing

              Write-Host "Installing Tailscale..."

              $process = Start-Process `
                -FilePath "msiexec.exe" `
                -ArgumentList "/i `"$installer`" /qn /norestart" `
                -Wait `
                -PassThru

              if ($process.ExitCode -ne 0) {
                  Write-Error "Tailscale installation failed. Exit code: $($process.ExitCode)"
                  exit 1
              }

              Write-Host "Tailscale installation completed."

              Remove-Item $installer -Force -ErrorAction SilentlyContinue
          }

      # ============================================================
      # 4. Verify Tailscale
      #
      # IMPORTANT:
      # We intentionally DO NOT run:
      #
      # tailscale up --authkey=...
      #
      # here. Tailscale is already running on the machine.
      # ============================================================
      - name: Verify Tailscale
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " Verifying Tailscale"
          Write-Host "========================================"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          Write-Host "Tailscale executable:"
          Write-Host $tailscale

          # Make sure the Windows service exists
          $tailscaleService = Get-Service `
            -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          if (-not $tailscaleService) {
              Write-Error "Tailscale Windows service was not found."
              exit 1
          }

          Write-Host ""
          Write-Host "Tailscale service status:"
          Write-Host $tailscaleService.Status

          if ($tailscaleService.Status -ne "Running") {
              Write-Host "Starting Tailscale service..."

              Start-Service `
                -Name "Tailscale" `
                -ErrorAction Stop

              Start-Sleep -Seconds 5
          }

          Write-Host ""
          Write-Host "Checking Tailscale status..."

          $status = & $tailscale status 2>&1

          if ($LASTEXITCODE -ne 0) {
              Write-Host $status
              Write-Error "Tailscale is installed but is not connected."
              exit 1
          }

          Write-Host ""
          Write-Host "========== Tailscale Status =========="
          Write-Host $status
          Write-Host "======================================"
          Write-Host ""

          Write-Host "Tailscale is connected."

      # ============================================================
      # 5. Get Tailscale IPv4 address
      # ============================================================
      - name: Get Tailscale IP
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " Getting Tailscale IPv4"
          Write-Host "========================================"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          $tsIP = $null

          for ($i = 1; $i -le 30; $i++) {

              $output = & $tailscale ip -4 2>$null

              $tsIP = $output |
                ForEach-Object {
                  $_.ToString().Trim()
                } |
                Where-Object {
                  $_ -match '^\d{1,3}(\.\d{1,3}){3}$'
                } |
                Select-Object -First 1

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting for Tailscale IP... attempt $i/30"

              Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
              Write-Error "No Tailscale IPv4 address was found."
              exit 1
          }

          Write-Host ""
          Write-Host "Tailscale IPv4: $tsIP"
          Write-Host ""

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      # ============================================================
      # 6. Verify RDP service
      # ============================================================
      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " Verifying RDP"
          Write-Host "========================================"

          $termService = Get-Service `
            -Name "TermService" `
            -ErrorAction Stop

          Write-Host "TermService status: $($termService.Status)"

          if ($termService.Status -ne "Running") {
              Write-Error "Remote Desktop service is not running."
              exit 1
          }

          $rdpEnabled = Get-ItemPropertyValue `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections'

          Write-Host "fDenyTSConnections: $rdpEnabled"

          if ($rdpEnabled -ne 0) {
              Write-Error "RDP is disabled."
              exit 1
          }

          Write-Host ""
          Write-Host "RDP is enabled and running."

      # ============================================================
      # 7. Verify RDP port 3389
      # ============================================================
      - name: Verify RDP Port
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " Verifying RDP port 3389"
          Write-Host "========================================"

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              Write-Error "Nothing is listening on TCP port 3389."
              exit 1
          }

          Write-Host "RDP is listening on TCP port 3389."

          $listener |
            Format-Table `
              LocalAddress,
              LocalPort,
              State,
              OwningProcess

      # ============================================================
      # 8. Display connection information
      # ============================================================
      - name: Display Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "        WINDOWS RDP CONNECTION"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host "  $env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "RDP Port:"
          Write-Host "  3389"
          Write-Host ""
          Write-Host "Username:"
          Write-Host "  runneradmin"
          Write-Host ""
          Write-Host "RDP Address:"
          Write-Host "  $env:TAILSCALE_IP`:3389"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host ""

      # ============================================================
      # 9. Keep runner job alive
      # ============================================================
      - name: Keep Runner Alive
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " Keeping runner alive"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "RDP is available at:"
          Write-Host "  $env:TAILSCALE_IP`:3389"
          Write-Host ""
          Write-Host "Username:"
          Write-Host "  runneradmin"
          Write-Host ""
          Write-Host "The job will remain active."
          Write-Host ""

          while ($true) {
              Write-Host "$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') - Runner alive - Tailscale IP: $env:TAILSCALE_IP"
              Start-Sleep -Seconds 300
          }
