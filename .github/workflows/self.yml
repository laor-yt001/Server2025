name: LaorORG

on:
  workflow_dispatch:

jobs:
  secure-LaorORG:
    runs-on: self-hosted

    timeout-minutes: 3600

    steps:

      # ------------------------------------------------------------
      # 1. Verify runner has Administrator privileges
      # ------------------------------------------------------------
      - name: Verify administrator privileges
        shell: powershell
        run: |
          Write-Host "=== Checking administrator privileges ==="

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)

          $isAdmin = $principal.IsInRole(
              [Security.Principal.WindowsBuiltInRole]::Administrator
          )

          Write-Host "Running as: $($identity.Name)"
          Write-Host "Administrator: $isAdmin"

          if (-not $isAdmin) {
              Write-Error "GitHub Actions runner is NOT running with Administrator privileges."
              Write-Error "Configure the self-hosted runner service to run with an elevated account."
              exit 1
          }

          Write-Host "Administrator privileges confirmed."

      # ------------------------------------------------------------
      # 2. Configure Windows Remote Desktop
      # ------------------------------------------------------------
      - name: Configure RDP
        shell: powershell
        run: |
          Write-Host "=== Configuring Windows RDP ==="

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Configure Remote Desktop service
          Set-Service `
            -Name 'TermService' `
            -StartupType Automatic

          if ((Get-Service -Name 'TermService').Status -ne 'Running') {
              Start-Service -Name 'TermService'
          }

          # Enable Windows Firewall RDP rules
          Enable-NetFirewallRule `
            -DisplayGroup 'Remote Desktop'

          Write-Host "RDP configuration completed."

      # ------------------------------------------------------------
      # 3. Configure runneradmin
      # ------------------------------------------------------------
      - name: Configure runneradmin
        shell: powershell
        env:
          RUNNERADMIN_PASSWORD: ${{ secrets.RUNNERADMIN_PASSWORD }}
        run: |
          Write-Host "=== Configuring runneradmin ==="

          $username = "runneradmin"

          if ([string]::IsNullOrWhiteSpace($env:RUNNERADMIN_PASSWORD)) {
              Write-Error "RUNNERADMIN_PASSWORD GitHub Secret is not configured."
              exit 1
          }

          # --------------------------------------------------------
          # Verify account exists
          # --------------------------------------------------------
          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Error "Windows user '$username' does not exist."
              Write-Error "Create runneradmin on the Windows machine first."
              exit 1
          }

          Write-Host "Found Windows account: $username"

          # --------------------------------------------------------
          # Create SecureString WITHOUT ConvertTo-SecureString
          # --------------------------------------------------------
          # This avoids the Microsoft.PowerShell.Security module
          # loading problem seen on this runner.
          # --------------------------------------------------------
          $securePassword = New-Object System.Security.SecureString

          foreach ($char in $env:RUNNERADMIN_PASSWORD.ToCharArray()) {
              $securePassword.AppendChar($char)
          }

          $securePassword.MakeReadOnly()

          # --------------------------------------------------------
          # Set password
          # --------------------------------------------------------
          Set-LocalUser `
            -Name $username `
            -Password $securePassword `
            -ErrorAction Stop

          Write-Host "Password updated successfully."

          # --------------------------------------------------------
          # Enable account
          # --------------------------------------------------------
          Enable-LocalUser `
            -Name $username `
            -ErrorAction Stop

          # --------------------------------------------------------
          # Password never expires
          # --------------------------------------------------------
          Set-LocalUser `
            -Name $username `
            -PasswordNeverExpires $true `
            -ErrorAction Stop

          # --------------------------------------------------------
          # Add account to Remote Desktop Users
          # --------------------------------------------------------
          $memberExists = Get-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.Name -match "\\$([regex]::Escape($username))$"
            }

          if (-not $memberExists) {

              Write-Host "Adding $username to Remote Desktop Users..."

              Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member $username `
                -ErrorAction Stop
          }
          else {
              Write-Host "$username is already a member of Remote Desktop Users."
          }

          # --------------------------------------------------------
          # Verify account
          # --------------------------------------------------------
          $verify = Get-LocalUser `
            -Name $username `
            -ErrorAction Stop

          Write-Host ""
          Write-Host "=== runneradmin verification ==="
          Write-Host "Username:         $($verify.Name)"
          Write-Host "Enabled:          $($verify.Enabled)"
          Write-Host "PasswordExpires:  $($verify.PasswordExpires)"
          Write-Host ""

          Write-Host "runneradmin configured successfully."

      # ------------------------------------------------------------
      # 4. Install Tailscale
      # ------------------------------------------------------------
      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "=== Installing Tailscale ==="

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {

              $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
              $installer = "$env:TEMP\tailscale.msi"

              Write-Host "Downloading Tailscale..."

              Invoke-WebRequest `
                -Uri $url `
                -OutFile $installer `
                -UseBasicParsing

              if (-not (Test-Path $installer)) {
                  Write-Error "Tailscale installer download failed."
                  exit 1
              }

              Write-Host "Installing Tailscale..."

              $process = Start-Process `
                -FilePath "msiexec.exe" `
                -ArgumentList "/i `"$installer`" /quiet /norestart" `
                -Wait `
                -PassThru

              if ($process.ExitCode -ne 0) {
                  Write-Error "Tailscale installation failed with exit code $($process.ExitCode)."
                  exit 1
              }

              Remove-Item `
                -Path $installer `
                -Force `
                -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          Write-Host "Tailscale installed."

      # ------------------------------------------------------------
      # 5. Configure Tailscale
      # ------------------------------------------------------------
      - name: Configure Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "=== Configuring Tailscale ==="

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              Write-Error "TAILSCALE_AUTH_KEY GitHub Secret is not configured."
              exit 1
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="LaorORG" `
            --unattended=true

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale configuration failed."
              exit 1
          }

          Write-Host "Tailscale configured successfully."

      # ------------------------------------------------------------
      # 6. Get Tailscale IPv4
      # ------------------------------------------------------------
      - name: Get Tailscale IP
        shell: powershell
        run: |
          Write-Host "=== Getting Tailscale IPv4 ==="

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $tsIP = $null

          for ($i = 1; $i -le 30; $i++) {

              $output = & $tailscale ip -4 2>$null

              if ($output) {

                  $tsIP = $output |
                    Where-Object {
                        $_ -match '^\d{1,3}(\.\d{1,3}){3}$'
                    } |
                    Select-Object -First 1
              }

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting for Tailscale... attempt $i/30"
              Start-Sleep -Seconds 2
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IPv4 address was not assigned."
              exit 1
          }

          $tsIP = $tsIP.ToString().Trim()

          Write-Host "Tailscale IPv4: $tsIP"

          "TAILSCALE_IP=$tsIP" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

      # ------------------------------------------------------------
      # 7. Verify RDP service
      # ------------------------------------------------------------
      - name: Verify RDP service
        shell: powershell
        run: |
          Write-Host "=== Verifying RDP service ==="

          $service = Get-Service -Name TermService

          Write-Host "Status:    $($service.Status)"
          Write-Host "StartType: $($service.StartType)"

          if ($service.Status -ne "Running") {
              Write-Error "TermService is not running."
              exit 1
          }

          Write-Host "TermService is running."

      # ------------------------------------------------------------
      # 8. Verify local RDP port
      # ------------------------------------------------------------
      - name: Verify RDP port
        shell: powershell
        run: |
          Write-Host "=== Testing local RDP port ==="

          $result = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not listening."
              exit 1
          }

          Write-Host "RDP port 3389 is listening."

      # ------------------------------------------------------------
      # 9. Verify Tailscale connection
      # ------------------------------------------------------------
      - name: Verify Tailscale connection
        shell: powershell
        run: |
          Write-Host "=== Verifying Tailscale ==="

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $status = & $tailscale status 2>&1

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale status check failed."
              Write-Host $status
              exit 1
          }

          Write-Host $status

          Write-Host ""
          Write-Host "Tailscale IPv4: $env:TAILSCALE_IP"

      # ------------------------------------------------------------
      # 10. Display connection information
      # ------------------------------------------------------------
      - name: Show LaorORG connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "           LaorORG RDP ACCESS"
          Write-Host "=========================================="
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : runneradmin"
          Write-Host "RDP Port     : 3389"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Password is stored in GitHub Secrets."
          Write-Host ""

      # ------------------------------------------------------------
      # 11. Keep workflow alive
      # ------------------------------------------------------------
      - name: Keep LaorORG runner active
        shell: powershell
        run: |
          Write-Host "LaorORG self-hosted runner is active."

          while ($true) {
              Write-Host "[$(Get-Date)] LaorORG online - Tailscale/RDP available"
              Start-Sleep -Seconds 300
          }
